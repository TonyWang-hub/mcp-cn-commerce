version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "auto-merge"
    open-pull-requests-limit: 10
    ignore:
      # Pydantic 2.13.5 requires core 2.46.5; 2.49.0 alone cannot resolve.
      # Remove this temporary exception when a matching Pydantic upgrade
      # requires core 2.49.0, then update both pins together.
      - dependency-name: "pydantic-core"
        versions: ["2.49.0"]
    groups:
      mcp-sdk:
        patterns:
          - "mcp"
          - "mcp-types"
      httpx2-stack:
        patterns:
          - "httpx2"
          - "httpcore2"
      pydantic-stack:
        patterns:
          - "pydantic"
          - "pydantic-core"
          - "pydantic_core"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
