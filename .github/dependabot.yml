version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "auto-merge"
    open-pull-requests-limit: 10
    groups:
      mcp-sdk:
        patterns:
          - "mcp"
          - "mcp-types"
      httpx2-stack:
        patterns:
          - "httpx2"
          - "httpcore2"
      pydantic-stack:
        patterns:
          - "pydantic"
          - "pydantic-core"
          - "pydantic_core"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
