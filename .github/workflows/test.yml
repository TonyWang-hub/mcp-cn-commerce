name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Reject private dependencies and imports before installation
        run: python scripts/check_public_boundary.py

  test:
    runs-on: ubuntu-latest
    needs: [public-boundary]
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install root package with the verified runtime lock
        run: python -m pip install -c requirements-lock.txt -e ".[dev]"
      - name: Check tool and documentation metadata
        run: python scripts/check_tool_metadata.py
      - name: Run all tests once and generate report
        run: python -m pytest servers/ tests/ -v --tb=short --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml

  install-smoke:
    runs-on: ubuntu-latest
    needs: [public-boundary]
    strategy:
      matrix:
        dependency-set: [locked, latest-supported]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Verify public wheel and source distribution boundaries
        run: python scripts/check_public_boundary.py --dist dist
      - name: Install wheel into a clean environment
        env:
          DEPENDENCY_SET: ${{ matrix.dependency-set }}
        run: |
          python -m venv "$RUNNER_TEMP/smoke-venv"
          source "$RUNNER_TEMP/smoke-venv/bin/activate"
          if [ "$DEPENDENCY_SET" = locked ]; then
            python -m pip install -c requirements-lock.txt dist/*.whl
          else
            python -m pip install --upgrade dist/*.whl
          fi
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/smoke_install.py"
      - name: Install sdist and exercise its entry points
        if: matrix.dependency-set == 'locked'
        run: |
          python -m venv "$RUNNER_TEMP/sdist-venv"
          source "$RUNNER_TEMP/sdist-venv/bin/activate"
          python -m pip install -c requirements-lock.txt dist/*.tar.gz
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/smoke_install.py"

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [public-boundary]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build runtime and development images
        run: |
          docker build --target runtime -t mcp-cn-commerce:smoke .
          docker build --target development -t mcp-cn-commerce:dev-smoke .
      - name: Test the development image
        run: docker run --rm mcp-cn-commerce:dev-smoke make test
      - name: Exercise real stdio connections to the runtime image
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/smoke_install.py" --docker mcp-cn-commerce:smoke

  manifest-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Validate Registry schema before publishing a package
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" -o "$RUNNER_TEMP/mcp-publisher.tar.gz"
          tar xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" validate

  lint:
    runs-on: ubuntu-latest
    needs: [public-boundary]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c requirements-lock.txt -e ".[dev]"
      - run: black --check .
      - run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    needs: [public-boundary]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c requirements-lock.txt -e ".[dev]"
      - run: mypy servers/ shared/ tests/ scripts/check_public_boundary.py --config-file=pyproject.toml

  code-quality:
    runs-on: ubuntu-latest
    needs: [public-boundary]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c requirements-lock.txt -e ".[dev]"
      - run: pylint --rcfile=pyproject.toml --disable=import-error servers/ shared/ scripts/check_public_boundary.py
      - run: bandit -c pyproject.toml -r servers/ shared/ scripts/check_public_boundary.py
