# Requires Docker Compose 2.24+ for optional env_file.
# Use one stdio connection per service, without a TTY:
# docker compose run --rm -T jd
# Tests do not need merchant credentials: docker compose run --rm test
services:
  test:
    build:
      context: .
      target: development
    command: ["make", "test"]
  test-cov:
    build:
      context: .
      target: development
    command: ["make", "test-cov"]
    volumes:
      - ./htmlcov:/app/htmlcov
  lint:
    build:
      context: .
      target: development
    command: ["make", "lint"]
  shell:
    build:
      context: .
      target: development
    command: /bin/bash
    stdin_open: true
    tty: true
    volumes:
      - .:/app
  oceanengine:
    build:
      context: .
      target: runtime
    command: ["mcp-cn-commerce", "start", "oceanengine"]
    env_file:
      - path: .env
        required: false
    stdin_open: true
    tty: false
  doudian:
